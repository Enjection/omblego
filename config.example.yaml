# omblego Configuration Example
# Copy to ~/.config/omblego/config.yaml or ./omblego.yaml

device:
  model: BP7000           # Device model name (e.g., BP7000, HEM-7322T)
  uuid: auto              # "auto" = auto-capture on first connection, saves to config
  # mac: ""               # Optional: explicit MAC address

daemon:
  enabled: false
  interval: 3h            # Sync interval (e.g., 1h, 30m, 3h)
  time_sync: true         # Sync device clock on each sync
  on_failure: backoff     # "continue", "backoff", "exit"
  # Signals (when running as daemon):
  #   SIGHUP  = Force immediate sync (skip interval wait)
  #   SIGTERM = Graceful shutdown (finish current sync)
  #   SIGINT  = Graceful shutdown

logging:
  level: info             # debug, info, warn, error, off
  format: text            # text, json
  output: stderr          # stderr, stdout, file, off (disables logging)
  file: ""                # Path when output=file

outputs:
  # CSV output (enabled by default)
  - type: csv
    enabled: true
    name: local-csv
    settings:
      directory: "."
      file_pattern: "user{user}.csv"
      create_backups: true

  # JSON output (UBPM-compatible format)
  - type: json
    enabled: false
    name: ubpm-export
    settings:
      file_path: ./ubpm.json
      format: ubpm          # "ubpm", "raw"
      pretty: true

  # InfluxDB output
  - type: influxdb
    enabled: false
    name: health-metrics
    settings:
      url: http://localhost:8086
      token: ${INFLUXDB_TOKEN}  # Use environment variable
      org: personal
      bucket: health
      measurement: blood_pressure
      tags:
        device: omron
        location: home
      batch_size: 100
      retry_count: 3

  # Webhook output (HTTP POST)
  - type: webhook
    enabled: false
    name: health-api
    settings:
      url: https://api.example.com/health/bp
      method: POST
      headers:
        Authorization: "Bearer ${API_TOKEN}"
        Content-Type: application/json
      format: json
      timeout: 30s
      retry_count: 3
      retry_delay: 5s

  # SQL Database output
  - type: database
    enabled: false
    name: local-db
    settings:
      driver: sqlite        # postgres, mysql, sqlite
      dsn: "./blood_pressure.db"
      table: blood_pressure
      batch_size: 50
      retry_count: 3
      # PostgreSQL example with env variable:
      # driver: postgres
      # dsn: "postgres://user:${POSTGRES_PASSWORD}@localhost:5432/health?sslmode=disable"

  # Script execution output
  - type: script
    enabled: false
    name: custom-handler
    settings:
      command: /usr/local/bin/handle-bp-data.sh
      args: []
      env:
        BP_DEVICE: "${device.model}"
      timeout: 30s
      input_mode: stdin     # stdin, args, env

  # Prometheus metrics endpoint
  - type: prometheus
    enabled: false
    name: metrics
    settings:
      port: 9090
      path: /metrics
